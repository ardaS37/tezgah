<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14161b">
  <title>Tezgah · Kod Çalışma Alanı</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" class="shell">
    <header class="topbar">
      <button id="sidebar-toggle" class="icon-button compact-only" data-icon="sidebar" title="Gezgini aç veya kapat" aria-label="Gezgini aç veya kapat"></button>
      <div class="brand"><img src="/logo.svg" alt="" width="28" height="28"><span>Tezgah<span class="brand-period">.</span></span></div>
      <div class="top-divider"></div>
      <button id="workspace-button" class="top-project" type="button"></button>
      <div class="top-spacer"></div>
      <button id="connections" class="connection-button" title="Sağlayıcı bağlantılarını yönet"><span class="connection-dot"></span><span>Bağlantılar</span></button>
      <button id="editor-toggle" class="icon-button panel-button" aria-label="Editörü aç veya kapat" title="Editörü aç veya kapat" data-icon="layout"></button>
    </header>
    <div class="workbench">
      <aside class="sidebar" aria-label="Çalışma gezgini">
        <div class="sidebar-block agents-section">
          <div class="section-label"><span>AJANLAR</span><button id="sidebar-add-agent" class="icon-button small" data-icon="plus" title="Yeni ajan" aria-label="Yeni ajan"></button></div>
          <div id="agent-list" class="agent-list"></div>
        </div>
        <div class="sidebar-block files-section">
          <div class="section-label"><span>DOSYALAR</span><div class="inline-tools"><button id="new-file" class="icon-button small" data-icon="filePlus" title="Yeni dosya" aria-label="Yeni dosya"></button><button id="tree-refresh" class="icon-button small" data-icon="refresh" title="Dosyaları yenile" aria-label="Dosyaları yenile"></button></div></div>
          <div id="tree-project" class="tree-project"></div>
          <div id="file-tree" class="file-tree"></div>
        </div>
        <div class="sidebar-footer"><button id="settings" class="icon-button small" data-icon="settings" title="Bağlantı ayarları" aria-label="Bağlantı ayarları"></button><button id="add-project" class="sidebar-footer-label">TEZGAH <span class="muted-dot">·</span> 0.1</span></div>
      </aside>
      <section class="agent-area" aria-label="Ajan çalışma alanı">
        <div class="pane-bar agent-bar">
          <div class="pane-title"><span data-icon="chat"></span><h1>Ajanlar</h1><span id="running-count" class="running-count" hidden></span></div>
          <div class="pane-actions">
            <div class="segmented" role="group" aria-label="Ajan görünümü">
              <button id="view-single" type="button" title="Tek ajan" aria-label="Tek ajan" data-icon="single"></button>
              <button id="view-split" type="button" title="Ajanları yan yana göster" aria-label="Ajanları yan yana göster" data-icon="split"></button>
            </div>
            <button id="add-agent" class="secondary-button" type="button" title="Yeni ajan ekle"><span data-icon="plus"></span><span class="toolbar-label">Yeni ajan</span></button>
          </div>
        </div>
        <div id="agent-grid" class="agent-grid"></div>
      </section>
      <div id="resizer" class="resizer" role="separator" aria-label="Editör genişliği" aria-orientation="vertical" tabindex="0"></div>
      <section class="editor-area" aria-label="Kod editörü">
        <div class="pane-bar editor-bar">
          <div class="pane-title"><span data-icon="code"></span><h2>Editör</h2></div>
          <div class="pane-actions"><button id="file-reload" class="icon-button" title="Dosyayı diskten yeniden yükle" aria-label="Dosyayı diskten yeniden yükle" data-icon="refresh" disabled></button><button id="save" class="secondary-button" title="Kaydet (Ctrl+S)" disabled><span data-icon="save"></span>Kaydet</button></div>
        </div>
        <div id="editor-tabs" class="editor-tabs" role="tablist" aria-label="Açık dosyalar"></div>
        <div id="breadcrumbs" class="breadcrumbs"></div>
        <div id="editor-notice" class="editor-notice" hidden></div>
        <div id="code-editor" class="code-editor" hidden>
          <div id="line-gutter" class="line-gutter" aria-hidden="true"><div id="line-numbers"></div></div>
          <div class="code-surface"><pre id="highlight" aria-hidden="true"></pre><textarea id="code-input" aria-label="Dosya içeriği" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"></textarea></div>
        </div>
        <div id="editor-empty" class="editor-empty"><div class="editor-empty-icon" data-icon="code"></div><strong>Dosya aç</strong><span>Düzenlemek için gezginden bir dosya seç.</span></div>
        <div class="editor-foot"><span id="editor-position">—</span><span class="editor-foot-spacer"></span><span id="editor-eol">LF</span><span>UTF-8</span><span id="editor-language">Metin</span></div>
      </section>
    </div>
    <footer class="statusbar"><div id="status-project"></div><div id="status-message" role="status"></div><div class="status-right"><span data-icon="monitor"></span> Yerel çalışma alanı</div></footer>
  </div>
  <div id="popover" class="popover" hidden></div>
  <dialog id="dialog" class="dialog"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
